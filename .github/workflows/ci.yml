name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ServiceBusExplorer.slnx
      - run: dotnet build ServiceBusExplorer.slnx --no-restore -c Release
      - run: dotnet test --solution ServiceBusExplorer.slnx --no-build -c Release
